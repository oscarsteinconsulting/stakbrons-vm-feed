name: Generate Stakbrons VM Feed

on:
  schedule:
    # Tider i UTC (svensk sommartid = UTC+2). VM-matcher spelas på svensk
    # kvälls-/nattid (NA-eftermiddag → natt), så feeden måste hållas färsk
    # DYGNET RUNT — inte bara dagtid. GitHubs schemalagda cron är "best effort"
    # och hoppas ofta över, SÄRSKILT på heltimme (xx:00) när lasten är som högst.
    # Därför: körningar var ~2:a timme på UDDA minuter, så en missad körning
    # aldrig lämnar feeden inaktuell mer än ett par timmar.
    - cron: '12 4 * * *'    # 06:12 svensk — morgon
    - cron: '5 6 * * *'     # 08:05 svensk — morgonrapport + SKICKA PUSH
    - cron: '23 8 * * *'    # 10:23
    - cron: '23 10 * * *'   # 12:23
    - cron: '37 12 * * *'   # 14:37
    - cron: '37 14 * * *'   # 16:37
    - cron: '23 16 * * *'   # 18:23 — kvällsmatcherna börjar
    - cron: '23 18 * * *'   # 20:23
    - cron: '37 20 * * *'   # 22:37
    - cron: '37 22 * * *'   # 00:37 — sena NA-matcher
    - cron: '23 0 * * *'    # 02:23 — NA-nattmatcher pågår
    - cron: '23 2 * * *'    # 04:23 — NA-nattmatcher avslutas
  workflow_dispatch:
    inputs:
      send_push:
        description: 'Skicka push-notis efter genereringen'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vm-feed
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # turneringssimuleringen (Monte Carlo) tar några minuter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generera feed.json
        env:
          # Valfri men rekommenderad: gratis token från football-data.org —
          # ger resultaträttning för ALLA matcher inkl. slutspel.
          # Utan token används vm2026-facit-repots results.json (gruppspelet).
          FOOTBALLDATA_TOKEN: ${{ secrets.FOOTBALLDATA_TOKEN }}
        run: python3 scripts/generate.py

      - name: Skicka morgonens push-notis (kl 08:00-körningen)
        if: github.event.schedule == '5 6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.send_push)
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          pip install --quiet google-auth requests
          python3 scripts/send_push.py

      - name: Commit & push om något ändrats
        run: |
          set -e
          git config user.name  "Stakbrons VM Bot"
          git config user.email "vm-bot@stakbrons.local"

          # Retry-loop för concurrent push-konflikter (samma mönster som
          # stakbrons-golf-feed): feeden är ren output från Kambi + Elo,
          # så det är alltid säkert att regenerera mot färsk remote.
          for attempt in 1 2 3; do
            git add data/
            if git diff --staged --quiet; then
              echo "Inga ändringar — hoppar över push"
              exit 0
            fi
            git commit -m "feed: $(date -u +'%Y-%m-%d %H:%M UTC') auto-uppdatering"

            if git push; then
              echo "Push lyckades på försök $attempt"
              exit 0
            fi

            echo "::warning::Push rejected, syncar mot remote (försök $attempt/3)"
            git reset --soft HEAD~1
            git reset
            git fetch origin
            git reset --hard origin/main
            python3 scripts/generate.py
          done

          echo "::error::Push misslyckades efter 3 försök"
          exit 1
