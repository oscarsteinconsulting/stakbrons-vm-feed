name: Generate Stakbrons VM Feed

# HEARTBEAT-MODELL. GitHubs schemalagda cron är "best effort" och droppar ofta
# körningar (särskilt nattetid) — att bara lista många cron-rader räcker inte.
# Lösning: varje körning är en LOOP som regenererar feeden var 20:e minut i upp
# till ~2,5 h. Cron var 2:a timme startar om loopen, och `cancel-in-progress`
# låter den nya körningen sömlöst ta över. Då räcker det att cron lyckas fyra
# NÅGON gång varannan timme — en missad slot täcks av den redan löpande loopen,
# som fortsätter sina 2,5 h. Publikt repo = obegränsade Actions-minuter.

on:
  schedule:
    # Tider i UTC (svensk sommartid = UTC+2). Udda minuter (xx:00 droppas oftast).
    - cron: '11 0 * * *'
    - cron: '13 2 * * *'
    - cron: '12 4 * * *'
    - cron: '7 6 * * *'      # ~08:xx svensk — morgonrapporten skickar push i loopen
    - cron: '23 8 * * *'
    - cron: '23 10 * * *'
    - cron: '37 12 * * *'
    - cron: '37 14 * * *'
    - cron: '23 16 * * *'
    - cron: '23 18 * * *'
    - cron: '37 20 * * *'
    - cron: '37 22 * * *'
  workflow_dispatch:
    inputs:
      send_push:
        description: 'Skicka push-notis efter genereringen'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vm-feed
  cancel-in-progress: true   # en ny körning tar sömlöst över den löpande loopen

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 160      # loopen kör ~2,5 h; gott om marginal under 6h-taket

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Heartbeat — regenerera feeden var 20:e minut i ~2,5 h
        env:
          # Gratis token från football-data.org — resultaträttning inkl. slutspel.
          FOOTBALLDATA_TOKEN: ${{ secrets.FOOTBALLDATA_TOKEN }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          # workflow_dispatch med send_push=true → skicka push på första varvet.
          DISPATCH_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.send_push }}
        run: |
          set -uo pipefail
          git config user.name  "Stakbrons VM Bot"
          git config user.email "vm-bot@stakbrons.local"

          LOOP_END=$(( $(date -u +%s) + 140*60 ))   # kör i ~2 h 20 min
          PUSHED=0

          regenerate_and_push() {
            # Synka mot remote först (manuella dispatchar delar concurrency-grupp).
            git fetch -q origin main && git reset -q --hard origin/main
            python3 scripts/generate.py || { echo "::warning::generate failade"; return; }
            git add data/
            if git diff --staged --quiet; then
              echo "Inga ändringar denna gång."
              return
            fi
            git commit -q -m "feed: $(date -u +'%Y-%m-%d %H:%M UTC') auto"
            for attempt in 1 2 3; do
              if git push -q; then echo "Push OK (försök $attempt)"; return; fi
              echo "::warning::Push rejected, synkar (försök $attempt/3)"
              git fetch -q origin main && git reset -q --hard origin/main
              python3 scripts/generate.py || return
              git add data/
              git diff --staged --quiet && return
              git commit -q -m "feed: $(date -u +'%Y-%m-%d %H:%M UTC') auto (retry)"
            done
            echo "::warning::Kunde inte pusha efter 3 försök — nästa varv tar det."
          }

          maybe_push_notification() {
            # Skicka morgonpushen EN gång när UTC-timmen är 06 (08:xx svensk),
            # eller vid manuell dispatch med send_push. Kräver FCM_SERVICE_ACCOUNT.
            local hour; hour=$(date -u +%H)
            if [ "$PUSHED" = "0" ] && { [ "$hour" = "06" ] || [ "${DISPATCH_PUSH}" = "true" ]; }; then
              if [ -n "${FCM_SERVICE_ACCOUNT:-}" ]; then
                pip install --quiet google-auth requests || true
                python3 scripts/send_push.py || echo "::warning::push failade"
              fi
              PUSHED=1
            fi
          }

          # Första varvet direkt, sedan var 20:e minut tills loopfönstret tar slut.
          while : ; do
            regenerate_and_push
            maybe_push_notification
            [ $(date -u +%s) -ge $LOOP_END ] && break
            sleep 1200
          done
          echo "Heartbeat klar — nästa cron/körning tar vid."
