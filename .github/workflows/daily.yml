name: Generate Stakbrons VM Feed (reserv)

# PRIMÄR backend är Mac mini-servern: launchd kör scripts/generate.py var 15:e
# minut och pushar feeden hit (se server/SETUP.md). En riktig launchd-cron stryps
# INTE som GitHubs schemalagda workflows (som droppade ~8 h i sträck nattetid och
# frös feeden). Den här workflowen är därför bara en RESERV:
#   - Den kollar hur gammal data/feed.json är. Är den FÄRSK (< 30 min) lever minin
#     och reserven gör ingenting (ingen dubbel-push, inget brus).
#   - Är den GAMMAL (minin nere/offline) regenererar och pushar reserven själv.
# GitHub-cron är best-effort (kan droppas nattetid), så reserven garanterar inget
# på egen hand — den fångar bara upp när minin är nere på dagtid. Morgonpushen
# deduppas mot minin via en commitad datummarkör (data/.last_morning_push).

on:
  schedule:
    - cron: '17 * * * *'      # varje timme (best-effort reserv)
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerera även om feeden är färsk'
        type: boolean
        default: false
      send_push:
        description: 'Skicka push-notis efter genereringen'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vm-feed
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reserv — regenerera bara om feeden blivit gammal (minin nere)
        env:
          FOOTBALLDATA_TOKEN: ${{ secrets.FOOTBALLDATA_TOKEN }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          DISPATCH_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.send_push }}
        run: |
          set -uo pipefail
          git config user.name  "Stakbrons VM Bot (reserv)"
          git config user.email "vm-bot@stakbrons.local"

          git fetch -q origin main && git reset -q --hard origin/main

          LAST=$(git log -1 --format=%ct -- data/feed.json 2>/dev/null || echo 0)
          AGE=$(( $(date -u +%s) - LAST ))
          if [ "${FORCE}" != "true" ] && [ "${DISPATCH_PUSH}" != "true" ] && [ "$AGE" -lt 1800 ]; then
            echo "Feeden färsk ($AGE s gammal) — Mac minin lever, reserven vilar."
            exit 0
          fi
          echo "Feeden ${AGE}s gammal (eller forcerad) — reserven genererar."

          regen() {
            python3 scripts/generate.py || { echo "::error::generate failade"; return 1; }
            git add data/
            git diff --staged --quiet && { echo "Inga ändringar."; return 0; }
            git commit -q -m "feed: $(date -u +'%Y-%m-%d %H:%M UTC') auto (reserv)"
          }
          regen || exit 1
          for a in 1 2 3; do
            git push -q && { echo "push OK ($a)"; break; }
            echo "::warning::push avvisad, synkar ($a/3)"
            git fetch -q origin main && git reset -q --hard origin/main
            regen || exit 1
          done

          # Morgonpush 06 UTC (08 svensk), deduppad mot minin via commitad markör.
          HOUR=$(date -u +%H); TODAY=$(date -u +%F); MARK="data/.last_morning_push"
          if [ -n "${FCM_SERVICE_ACCOUNT:-}" ] \
             && { [ "$HOUR" = "06" ] || [ "${DISPATCH_PUSH}" = "true" ]; } \
             && { [ "${DISPATCH_PUSH}" = "true" ] || [ ! -f "$MARK" ] || [ "$(cat "$MARK" 2>/dev/null)" != "$TODAY" ]; }; then
            pip install --quiet google-auth requests || true
            if python3 scripts/send_push.py && [ "${DISPATCH_PUSH}" != "true" ]; then
              echo "$TODAY" > "$MARK"
              git add "$MARK" && git commit -q -m "feed: morgonpush $TODAY (reserv)" \
                && git push -q 2>/dev/null || true
            fi
          fi
          echo "Reserv klar."
